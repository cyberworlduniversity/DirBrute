name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build JAR
        run: mvn --batch-mode --no-transfer-progress package
      - name: Compile validation tests
        run: mkdir -p build && javac -Xlint:all -d build main/java/com/dirbrute/DirBrute.java tests/DirBruteValidationTest.java
      - name: Run validation tests
        run: java -cp build DirBruteValidationTest
